name: Build-Push-Image
# Publishes the helxplatform pgAdmin image to containers.renci.org. The
# upstream check-*.yml workflows only validate (docker build with push:false),
# so this workflow is what actually produces the deployable image.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set short git commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: containers.renci.org
          username: ${{ secrets.CONTAINERHUB_USERNAME }}
          password: ${{ secrets.CONTAINERHUB_TOKEN }}
          logout: true

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="containers.renci.org/${{ github.repository }}"
          SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
          EVENT="${{ github.event_name }}"
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if [ "$EVENT" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "${IMAGE}:test_${PR_NUM}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:test_${PR_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.ref_name }}"
            echo "${IMAGE}:${BRANCH}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
